<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>JS Project</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="canvas"></canvas>   
        <div id="setting">
            <div id="setting_text_div">
                <p id="setting_text">커스텀</p>
            </div>
            <div id="setting_controllor_div">
                <br>
                <label><b>배경 크기</b>&nbsp;<input type="range" min="300" max="900" value="800" step="50" class="setting_bar" id="main_bar" oninput="get_size()"></label>
                <br><br>
                <label><b>원 크기</b>&nbsp;&nbsp;&nbsp;<input type="range" min="0.2" max="0.5" value="0.35" step="0.05" class="setting_bar" id="chr_bar" oninput="get_chr_size()"></label>
                <br><br>
                <label><b>테마</b></label>
                <div class="theme_div">
                    <div class="theme_infor" id="first_theme_infor">기본</div>
                    <div class="theme" id="default" onclick="setting_theme(1)"></div>
                    <br><br><br>
                    <div class="theme_infor">가을</div>
                    <div class="theme" id="autumn" onclick="setting_theme(2)"></div>
                    <br><br><br>
                    <div class="theme_infor">숲</div>
                    <div class="theme" id="forest" onclick="setting_theme(3)"></div>
                    <br><br><br>
                    <div class="theme_infor">한파</div>
                    <div class="theme" id="ice" onclick="setting_theme(4)"></div>
                    <br><br><br>
                    <div class="theme_infor">바다</div>
                    <div class="theme" id="ocean" onclick="setting_theme(5)"></div>
                    <br><br><br>
                    <div class="theme_infor">공허</div>
                    <div class="theme" id="void" onclick="setting_theme(6)"></div>
                    <br><br><br>
                    <div class="theme_infor">우주</div>
                    <div class="theme" id="space" onclick="setting_theme(7)"></div>
                </div>       
            </div>
        </div>
        <div id="score_board">
            <label style="font-size: 20pt;"><b>Score</b></label>
            <div id="score"></div>

            <br>
            <label style="font-size: 20pt;"><b>Best_Score</b></label>
            <div id="best_score"></div>
        </div>
        <div id="guide">
            <p><b>tip</b></p>
            <p>키보드의 방향키를 이용하여 이동할 수 있습니다!</p>
        </div>
        <script src="main.js"></script>
    </body>
</html>
